[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomspike"
version = "0.1.0"
description = "AtomSpike: atomic-level game agent with CNN+Transformer perception and a spiking policy head"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AtomSpike" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
capture = ["mss>=9.0", "pynput>=1.7", "pygame-ce>=2.5"]
vizdoom = ["vizdoom>=1.2"]
wandb = ["wandb>=0.16"]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
atomspike = "atomspike.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atomspike*"]

[tool.setuptools.package-data]
atomspike = ["py.typed", "_configs/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["atomspike"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["runs"]

[tool.ruff.lint]
# Start with correctness rules across the existing research code. Style rules
# can be enabled incrementally without hiding runtime defects in a large diff.
select = ["E4", "E7", "E9", "F"]
