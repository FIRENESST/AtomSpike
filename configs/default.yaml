encoder:
  frame_size: 84
  d_model: 128
  stem_channels: [16, 32, 64]

reasoner:
  n_layers: 2
  n_heads: 4
  game_state_dim: 19
  n_state_tokens: 4

adapter:
  enabled: true
  hidden: 32

planner:
  enabled: true
  latent_dim: 64
  hidden: 128
  n_phases: 16
  n_plan_tokens: 2
  future_steps: 15
  future_near: 5
  future_far: 45
  session_gap_s: 2.0
  time_coef: 0.12
  arrange: 0.7
  creative: true
  explore: 0.08

policy:
  kind: spike
  n_layers: 2
  n_heads: 4
  action_decode: gru_ar
  temperature: 1.0
  spike_time_steps: 2

action:
  n_keys: 8
  key_names: [W, A, S, D, SPACE, SHIFT, CTRL, E]
  mouse_bins: 41
  mouse_delta_max: 240
  mouse_delta_scale: 16

dual_rate:
  perception_hz: 5.0
  policy_hz: 30.0
  mode: sim
  pace: false

train:
  batch_size: 32
  lr: 0.0003
  epochs: 32
  seed: 0
  device: auto
  val_frac: 0.1
  gui_sample_weight: 2.0
  motion_sample_weight: 5.0
  look_move_ce_boost: 4.0
  slot_balance: false

env:
  kind: minecraft
  max_steps: 128

capture:
  fps: 30
  store_width: 854
  store_height: 480
  window_title: Minecraft

minecraft:
  window_title: Minecraft
  sidecar_udp_port: 21337
  poll_saves_hz: 2.0
  hud_probe: true
  stop_key: F9
  mark_key: F8
  state_dim: 19

convert:
  method: pmsm
  time_steps: 1
